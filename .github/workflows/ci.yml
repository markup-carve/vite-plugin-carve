name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
